# Baseline experiment: EfficientNet-B0 on APTOS 2019, no uncertainty.
# This is the reference point every later experiment is compared against.

experiment:
  name: baseline_efficientnet_b0_aptos
  tags: [baseline, aptos, efficientnet]
  seed: 42

data:
  dataset: aptos2019
  root: ${oc.env:DATA_ROOT,./data}
  image_size: 224
  num_classes: 5
  # Stratified split, fixed across all experiments
  val_fraction: 0.15
  test_fraction: 0.15
  num_workers: 4

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3       # Kept on at inference time later for MC Dropout
  num_classes: ${data.num_classes}

training:
  epochs: 30
  batch_size: 32
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  label_smoothing: 0.0
  mixed_precision: true
  gradient_clip: 1.0
  early_stopping_patience: 7

logging:
  wandb_project: ${oc.env:WANDB_PROJECT,retinal-selective-prediction}
  wandb_entity: ${oc.env:WANDB_ENTITY,null}
  log_every_n_steps: 20
  save_top_k: 3

paths:
  output_dir: experiments/runs/${experiment.name}
